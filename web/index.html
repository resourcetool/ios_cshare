<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CSHARE</title>
    <meta name="description" content="CSHARE weekly assignments" />
    <meta name="theme-color" content="#0E5A66" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CSHARE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      /* Same typeface as the Android app (Roboto). Symbols and arrows used by the app's icons come from the
         Noto symbol fonts, as on Android, instead of whatever iOS substitutes. */
      html, body, #root, #root *, input, textarea, button, select {
        font-family: Roboto, 'Noto Sans Symbols', 'Noto Sans Symbols 2', 'Noto Sans Math', sans-serif !important;
      }
      input, textarea, button { outline: none; }
      input[type='date'], input[type='time'] { -webkit-appearance: none; appearance: none; }
      html, body, #root { height: 100%; }
      body { margin: 0; background: #F3F6F6; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; flex-direction: column; }
      @media (prefers-color-scheme: dark) { body { background: #0E1416; } }
    </style>
  </head>
  <body>
    <noscript>CSHARE needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
